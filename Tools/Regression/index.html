<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Regression Visualizer | Least Squares Fit</title>
  <meta name="description" content="Interactive visualizer for Linear Least Squares Regression, vertical residuals, and squared error areas.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Shared Design System & Theme Engine -->
  <link rel="stylesheet" href="../../shared/css/theme.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/tool-nav.css">
  <link rel="stylesheet" href="styles.css">

  <script src="../../shared/js/theme.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="nav-left">
        <a href="../../index.html" class="mrbyron-back-hub btn-back-hub" title="Return to Tools Hub">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span class="hub-text">All Tools</span>
        </a>

        <div class="nav-divider"></div>

        <div class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="20" x2="21" y2="4"></line>
              <circle cx="7" cy="16" r="2" fill="currentColor"></circle>
              <circle cx="12" cy="10" r="2" fill="currentColor"></circle>
              <circle cx="17" cy="6" r="2" fill="currentColor"></circle>
            </svg>
          </div>
          <div class="brand-title">
            <h1>Regression Visualizer</h1>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <!-- Appearance Settings Button -->
        <button id="btn-settings-toggle" class="btn btn-icon btn-ghost" title="Appearance Settings" aria-label="Appearance Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <button id="btn-theme-toggle" class="btn btn-icon btn-ghost" title="Toggle Theme" aria-label="Toggle Theme">
          <span id="theme-icon"></span>
          <span class="theme-label" style="display: none;">Theme</span>
        </button>

        <button id="btn-fit" class="btn btn-primary btn-sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
            <polyline points="16 7 22 7 22 13"></polyline>
          </svg>
          <span>Fit Line</span>
        </button>

        <button id="btn-randomize" class="btn btn-secondary btn-sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span>Randomize</span>
        </button>

        <button id="btn-clear" class="btn btn-ghost btn-sm btn-icon" title="Clear points">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace (Canvas + Controls Sidebar) -->
    <main class="workspace">
      <!-- Canvas Container -->
      <section class="canvas-section">
        <!-- Canvas Overlay Controls Bar -->
        <div class="canvas-overlay-bar">
          <div class="toggle-group">
            <label class="toggle-switch">
              <input type="checkbox" id="chk-residuals" checked>
              <span class="slider"></span>
              <span class="toggle-label">
                <span class="color-dot amber"></span> Residuals
              </span>
            </label>

            <label class="toggle-switch">
              <input type="checkbox" id="chk-squares" checked>
              <span class="slider"></span>
              <span class="toggle-label">
                <span class="color-dot yellow-box"></span> Squares
              </span>
            </label>

            <label class="toggle-switch">
              <input type="checkbox" id="chk-ols" checked>
              <span class="slider"></span>
              <span class="toggle-label">
                <span class="color-dot purple-dashed"></span> OLS Line
              </span>
            </label>

            <label class="toggle-switch">
              <input type="checkbox" id="chk-meany">
              <span class="slider"></span>
              <span class="toggle-label">
                <span class="color-dot gray-dashed"></span> Mean (ȳ)
              </span>
            </label>
          </div>

          <div class="canvas-hint">
            <span>Click canvas to add points • Drag handles to adjust line</span>
          </div>
        </div>

        <!-- Main Interactive Canvas -->
        <div class="canvas-wrapper">
          <canvas id="regression-canvas"></canvas>
          
          <!-- Toast notification overlay -->
          <div id="toast-message" class="toast hidden"></div>
        </div>
      </section>

      <!-- Sidebar Controls & Analytics -->
      <aside class="sidebar">
        <!-- Section 1: Line Formula & Equation Controls -->
        <div class="card">
          <div class="card-header">
            <h3>Linear Model</h3>
            <span class="badge badge-primary">y = mx + c</span>
          </div>
          <div class="card-body">
            <div class="equation-display">
              <span class="eq-var">y</span> = 
              <span class="eq-val" id="val-m-display">1.00</span><span class="eq-var">x</span> 
              <span class="eq-op" id="val-c-sign">+</span> 
              <span class="eq-val" id="val-c-display">0.00</span>
            </div>

            <!-- Slope Slider -->
            <div class="control-field">
              <div class="field-label">
                <label for="slider-m">Slope (m)</label>
                <input type="number" id="num-m" step="0.05" min="-10" max="10" value="1.00" class="num-input">
              </div>
              <input type="range" id="slider-m" step="0.01" min="-5" max="5" value="1">
            </div>

            <!-- Intercept Slider -->
            <div class="control-field">
              <div class="field-label">
                <label for="slider-c">Y-Intercept (c)</label>
                <input type="number" id="num-c" step="0.1" min="-10" max="10" value="0.00" class="num-input">
              </div>
              <input type="range" id="slider-c" step="0.05" min="-5" max="15" value="0">
            </div>

            <button id="btn-reset-line" class="btn btn-outline btn-sm btn-block">
              Reset Line
            </button>
          </div>
        </div>

        <!-- Section 2: Live Statistics -->
        <div class="card highlight-card">
          <div class="card-header">
            <h3>Error Metrics</h3>
            <span class="badge badge-secondary">Live</span>
          </div>
          <div class="card-body">
            <div class="stats-grid">
              <!-- SSE Stat Card -->
              <div class="stat-box primary-stat">
                <div class="stat-label">
                  <span>Squared Errors (SSE)</span>
                </div>
                <div class="stat-value amber-text" id="stat-sse">0.000</div>
                <div class="stat-progress-bar">
                  <div class="progress-fill amber-bg" id="bar-sse" style="width: 50%;"></div>
                </div>
              </div>

              <!-- R-squared Stat -->
              <div class="stat-box">
                <div class="stat-label">
                  <span>R²</span>
                </div>
                <div class="stat-value green-text" id="stat-r2">0.000</div>
              </div>

              <!-- MSE Stat -->
              <div class="stat-box">
                <div class="stat-label">MSE</div>
                <div class="stat-value" id="stat-mse">0.000</div>
              </div>

              <!-- RMSE Stat -->
              <div class="stat-box">
                <div class="stat-label">RMSE</div>
                <div class="stat-value" id="stat-rmse">0.000</div>
              </div>

              <!-- Best Fit Comparison -->
              <div class="stat-box full-width">
                <div class="stat-label">Optimal OLS Line</div>
                <div class="ols-equation" id="ols-equation-display">y = 1.000x + 0.000</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Section 3: Data Presets & Generation -->
        <div class="card">
          <div class="card-header">
            <h3>Data Presets</h3>
          </div>
          <div class="card-body">
            <div class="preset-buttons">
              <button class="preset-btn" data-preset="linear">Linear</button>
              <button class="preset-btn" data-preset="noisy">Noisy</button>
              <button class="preset-btn" data-preset="outlier">Outlier</button>
              <button class="preset-btn" data-preset="horizontal">Flat</button>
            </div>

            <div class="control-field">
              <div class="field-label">
                <label for="gen-count">Points: <span id="gen-count-val">15</span></label>
              </div>
              <input type="range" id="gen-count" min="3" max="50" value="15">
            </div>

            <div class="control-field">
              <div class="field-label">
                <label for="gen-noise">Noise: <span id="gen-noise-val">1.2</span></label>
              </div>
              <input type="range" id="gen-noise" min="0.1" max="4.0" step="0.1" value="1.2">
            </div>
          </div>
        </div>

        <!-- Section 4: Data Point List Drawer -->
        <div class="card collapsible-card">
          <div class="card-header" id="points-accordion-header">
            <h3>Points (<span id="point-count-badge">0</span>)</h3>
            <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="card-body accordion-content hidden" id="points-accordion-content">
            <div class="table-container">
              <table class="points-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>X</th>
                    <th>Y</th>
                    <th>eᵢ</th>
                    <th>eᵢ²</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="points-table-body">
                  <!-- Dynamically populated -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
