<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Automated Test Suite & Diagnostics">
  <title>Automated Test Suite &amp; Diagnostics</title>

  <!-- Shared Design System -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/theme.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/tool-nav.css">
  <link rel="stylesheet" href="./runner.css">

  <script src="../shared/js/theme.js"></script>
</head>
<body class="bg-grid-pattern">

  <!-- Header -->
  <header class="mrbyron-tool-header">
    <div class="mrbyron-nav-left">
      <a href="../index.html" class="mrbyron-back-hub btn-back-hub" title="Return to Tools Hub">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span class="hub-text">All Tools</span>
      </a>
      <div class="mrbyron-divider"></div>
      <div class="mrbyron-tool-info">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <h1>Automated Test Suite &amp; Diagnostics</h1>
      </div>
    </div>
    <div class="mrbyron-nav-right">
      <button id="btn-theme-toggle" class="btn-theme-toggle" title="Toggle Theme">
        <span id="theme-icon"></span>
        <span class="theme-label">Theme</span>
      </button>
    </div>
  </header>

  <!-- Main Dashboard -->
  <main class="test-dashboard">

    <!-- Action Toolbar & Mode Selector -->
    <section class="test-controls-card">
      <div class="test-controls-left">
        <div class="suite-mode-selector">
          <button id="btn-mode-quick" class="mode-tab-btn" data-mode="quick">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <span>Minor Changes (Quick Smoke)</span>
          </button>
          <button id="btn-mode-full" class="mode-tab-btn active" data-mode="full">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
            <span>Major Changes (Full Regression)</span>
          </button>
        </div>
      </div>

      <div class="test-controls-right">
        <button id="btn-run-tests" class="btn btn-primary btn-lg pulse-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span id="btn-run-text">Run Test Suite</span>
        </button>
      </div>
    </section>

    <!-- Overall Summary & Metrics Bar -->
    <section class="test-summary-card">
      <div class="metrics-grid">
        <div class="metric-box status-box" id="metric-status-box">
          <span class="metric-label">OVERALL STATUS</span>
          <span class="metric-value status-text" id="metric-status">Ready to Run</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">TESTS RUN</span>
          <span class="metric-value" id="metric-total">0</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">PASSED</span>
          <span class="metric-value pass-text" id="metric-passed">0</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">FAILED</span>
          <span class="metric-value fail-text" id="metric-failed">0</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">EXECUTION TIME</span>
          <span class="metric-value" id="metric-duration">0.00s</span>
        </div>
      </div>

      <!-- Live Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar" id="test-progress-bar" style="width: 0%;"></div>
      </div>
    </section>

    <!-- Test Suites Output List -->
    <section class="test-suites-container" id="test-suites-container">
      <!-- Dynamically filled with test suites and individual assertions -->
    </section>

  </main>

  <!-- Hidden Test Iframe sandbox for DOM simulation -->
  <iframe id="test-sandbox-iframe" style="position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; visibility: hidden;"></iframe>

  <!-- Scripts -->
  <script src="../shared/js/tools-data.js"></script>
  <script src="./runner.js"></script>
</body>
</html>
